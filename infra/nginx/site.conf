# Shared body for one network's server block. infra/deploy.sh fills __NET__ / __PORT__
# and wraps it in an HTTP or HTTPS server depending on whether the certificate exists yet.
root /srv/ontoppad/__NET__/web;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
client_max_body_size 3m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  try_files $uri =404;
}

location /api/media/ {
  alias /srv/ontoppad/__NET__/data/media/;
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'none'" always;
}

location = /api/metadata {
  limit_req zone=ontop_upload___NET__ burst=4 nodelay;
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
}

location /api/ {
  limit_req zone=ontop_api___NET__ burst=40 nodelay;
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_http_version 1.1;
}

location / {
  add_header Cache-Control "no-cache";
  try_files $uri /index.html;
}
